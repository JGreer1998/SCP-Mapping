<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scottish Child Payment by Local Authority</title>
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  .panel { background: #e8eef3; padding: 8px 12px; border-radius: 6px;
           box-shadow: 0 1px 5px rgba(0,0,0,.3); font: 14px sans-serif; }
  .legend i { display: inline-block; width: 18px; height: 12px;
              margin-right: 6px; vertical-align: middle;
              border: 1px solid #999; }
  .legend .item { display: block; }
  .legend .short { display: none; }
  .slider-row { display: flex; align-items: center; gap: 8px; }
  #slider { width: 220px; }
  .note { max-width: 260px; }
  details summary { cursor: pointer; margin-top: 6px; }

  @media (max-width: 600px) {
    .panel { font-size: 12px; padding: 6px 8px; }
    .panel hr { margin: 4px 0; }
    .info { max-width: calc(100vw - 80px); }   /* clear zoom buttons */

    /* Make the bottom-right corner span the full width */
    .leaflet-bottom.leaflet-right { left: 0; }
    .leaflet-bottom.leaflet-right .panel {
      width: calc(100% - 20px); box-sizing: border-box; }

    #slider { width: auto; flex: 1; }
    #play { min-width: 40px; min-height: 32px; }   /* bigger tap target */

    /* Horizontal legend */
    .legend br.desk { display: none; }
    .legend-items { display: flex; gap: 2px; margin-top: 4px; }
    .legend .item { flex: 1; text-align: center; font-size: 11px; }
    .legend i { display: block; width: auto; margin: 0 0 2px; }
    .legend .full { display: none; }
    .legend .short { display: inline; }

    .leaflet-control-attribution { font-size: 9px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ---- SETTINGS: check these match your GeoJSON field names ----
const YEARS = [2020, 2021, 2022, 2023, 2024, 2025, 2026];
const LABEL = {
  2020: '2020/21 (from Feb 2021)', 2021: '2021/22', 2022: '2022/23',
  2023: '2023/24', 2024: '2024/25', 2025: '2025/26',
  2026: '2026/27 (Apr–Jun)'
};
const NAME_FIELD = 'LAD20NM';
const VAL = y => 'Val_' + y;      // e.g. 'QGISMaster_Val_' + y if prefixed
const POP = y => 'Pop_' + y;
const BREAKS = [80, 95, 105, 120];                  // Scotland = 100
const COLOURS = ['#2166ac', '#92c5de', '#f7f7f7', '#f4a582', '#b2182b'];
const CLASS_LABELS = ['Well below (under 80)', 'Below (80–95)',
  'Around Scotland (95–105)', 'Above (105–120)', 'Well above (120+)'];
  const isMobile = window.matchMedia('(max-width: 600px)').matches;
const SHORT_LABELS = ['<80', '80–95', '95–105', '105–120', '120+'];
const NOTE = 'Payments: Social Security Scotland, financial years. ' +
  'Children: NRS mid-year estimates, ages 0–15 (2026 uses 2025). ' +
  'Under-6s only eligible until Nov 2022.';
// ---------------------------------------------------------------

let yearIdx = YEARS.indexOf(2025);
let layer, info;
const scot = {};                     // Scotland £ per child, by year
const year = () => YEARS[yearIdx];
const label = y => LABEL[y] || y;
const gbp = n => '£' + Math.round(n).toLocaleString('en-GB');

function perChild(p, y) {
  const v = +p[VAL(y)], pop = +p[POP(y)];
  return pop > 0 && !isNaN(v) ? v / pop : null;
}
function idx(p, y) {
  const r = perChild(p, y);
  return r == null ? null : 100 * r / scot[y];
}
function colour(v) {
  if (v == null || isNaN(v)) return '#ccc';
  for (let i = 0; i < BREAKS.length; i++) {
    if (v < BREAKS[i]) return COLOURS[i];
  }
  return COLOURS[COLOURS.length - 1];
}
function style(f) {
  return { fillColor: colour(idx(f.properties, year())),
           weight: 1, color: '#444', fillOpacity: 0.85 };
}

const map = L.map('map', { zoomSnap: 0.25 }).setView([57.5, -4.5], 6);
  
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">' +
               'OpenStreetMap</a> contributors | ' +
               'Contains OS data &copy; Crown copyright and database ' +
               'right 2026'
}).addTo(map);
  
fetch('councils.geojson')
  .then(r => r.json())
  .then(data => {
    // Copy prefixed QGIS fields to short names, e.g.
    // 'TotalPop2025 — QGISMaster_Val_2020' becomes 'Val_2020'
    data.features.forEach(f => {
      const p = f.properties;
      Object.keys(p).forEach(k => {
        const m = k.match(/(Val|Pop|Rate)_(\d{4})$/);
        if (m) p[m[1] + '_' + m[2]] = p[k];
      });
    });
    // Scotland figure = total paid / total children, per year
    YEARS.forEach(y => {
      let v = 0, p = 0;
      data.features.forEach(f => {
        v += +f.properties[VAL(y)] || 0;
        p += +f.properties[POP(y)] || 0;
      });
      scot[y] = p ? v / p : null;
    });

    // Hover info box
    info = L.control({ position: 'topright' });
    info.onAdd = function () {
      this._div = L.DomUtil.create('div', 'panel info');
      this.update();
      return this._div;
    };
    info.update = function (p) {
      const y = year();
      let html = `<b>Scottish Child Payment, ${label(y)}</b><br>
        Scotland: ${gbp(scot[y])} per child<hr>`;
      if (p) {
        const r = perChild(p, y), i = idx(p, y);
        html += r == null ? `<b>${p[NAME_FIELD]}</b><br>No data` :
          `<b>${p[NAME_FIELD]}</b><br>
           ${gbp(r)} per child<br>
           ${gbp(r * 1000)} per 1,000 children<br>
           Index: ${Math.round(i)} (Scotland = 100)<br>
           Total paid: ${gbp(+p[VAL(y)])}`;
      } else {
        html += 'Hover over a council area';
      }
      this._div.innerHTML = html;
    };
    info.addTo(map);

        // Year slider + play button (added first so it sits lowest on mobile)
    const sliderCtl = L.control({
      position: isMobile ? 'bottomright' : 'bottomleft'
    });
    sliderCtl.onAdd = function () {
      const d = L.DomUtil.create('div', 'panel');
      d.innerHTML = `<b>Year: <span id="yr">${label(year())}</span></b>
        <div class="slider-row">
          <input type="range" id="slider" min="0"
                 max="${YEARS.length - 1}" value="${yearIdx}">
          <button id="play">▶</button>
        </div>`;
      L.DomEvent.disableClickPropagation(d);
      return d;
    };
    sliderCtl.addTo(map);

    // Legend
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
      const d = L.DomUtil.create('div', 'panel legend');
      d.innerHTML =
        '<b>Payment per child aged 0–15<br class="desk"> ' +
        'vs Scotland (=100)</b><div class="legend-items">' +
        COLOURS.map((c, i) =>
          `<span class="item"><i style="background:${c}"></i>` +
          `<span class="full">${CLASS_LABELS[i]}</span>` +
          `<span class="short">${SHORT_LABELS[i]}</span></span>`
        ).join('') + '</div>';
      if (isMobile) {
        d.innerHTML += '<details><summary>About the data</summary>' +
                       `<small>${NOTE}</small></details>`;
        L.DomEvent.disableClickPropagation(d);
      }
      return d;
    };
    legend.addTo(map);

    // Data note: own panel on desktop, folded into legend on mobile
    if (!isMobile) {
      const note = L.control({ position: 'bottomleft' });
      note.onAdd = () => {
        const d = L.DomUtil.create('div', 'panel note');
        d.innerHTML = `<small>${NOTE}</small>`;
        return d;
      };
      note.addTo(map);
    }
    // Council boundaries
    layer = L.geoJSON(data, {
      style,
      onEachFeature: (f, l) => l.on({
        mouseover: e => { e.target.setStyle({ weight: 3, color: '#000' });
                          e.target.bringToFront();
                          info.update(f.properties); },
        mouseout: e => { layer.resetStyle(e.target); info.update(); },
        click: e => {
          if (!isMobile) map.fitBounds(e.target.getBounds());
        }
      })
    }).addTo(map);

    map.fitBounds(layer.getBounds(), isMobile ? {
      paddingTopLeft: [0, info.getContainer().offsetHeight + 10],
      paddingBottomRight: [0, document.querySelector(
        '.leaflet-bottom.leaflet-right').offsetHeight]
    } : {});

    function setYear(i) {
      yearIdx = i;
      document.getElementById('yr').textContent = label(year());
      document.getElementById('slider').value = i;
      layer.setStyle(style);
      info.update();
    }
    document.getElementById('slider').addEventListener('input',
      e => setYear(+e.target.value));

    let timer = null;
    document.getElementById('play').addEventListener('click', e => {
      if (timer) { clearInterval(timer); timer = null;
                   e.target.textContent = '▶'; return; }
      e.target.textContent = '⏸';
      timer = setInterval(
        () => setYear((yearIdx + 1) % YEARS.length), 1200);
    });
  });
</script>
</body>
</html>
